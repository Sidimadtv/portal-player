[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = []

[functions.api]
  timeout = 60

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/proxy/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/fetch"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/stalker.html"
  to = "/stalker.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200
